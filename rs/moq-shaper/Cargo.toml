[package]
name = "moq-shaper"
description = "Media over QUIC - Seeded userspace UDP path impairment for tests"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.0.1"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "webtransport", "testing", "network", "live"]
categories = ["network-programming", "development-tools::testing"]

publish = false

[[bin]]
name = "moq-shaper"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
humantime = { workspace = true }
humantime-serde = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
